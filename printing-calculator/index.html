<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Design Line Printing Calculator</title><link rel='stylesheet' href='style.css'></head><body><header><h1>Design Line Agency</h1><p>Offset, Packaging & Digital Printing Quotation Calculator</p></header><main><nav><button class='tab active' data-tab='offset'>Offset Printing</button><button class='tab' data-tab='packaging'>Packaging</button><button class='tab' data-tab='digital'>Digital Printing</button></nav><section id='offset' class='panel active'><h2>Offset Printing Calculator</h2><div class='grid'><label>Customer Name<input id='oCustomer'></label><label>Item Type<div class='withplus'><select id='oItem'></select><button type='button' class='plus' onclick="addOption('oItem','dlaOffsetItems','New Offset Item')">+</button></div></label><label>Quantity<input id='oQty' type='number' value='1000'></label><label>Paper Type<div class='withplus'><select id='oPaper'></select><button type='button' class='plus' onclick="addOption('oPaper','dlaPapers','New Paper Type')">+</button></div></label><label>GSM<input id='oGsm' type='number' value='300'></label><label>Parent Sheet Size (inch)<input id='oSheetSize' value='23x36'></label><label>Machine Print Area (inch)<input id='oPrintArea' value='11.5x18'></label><label>Job / Print Size (inch)<input id='oJobSize' value='3.5x2'></label><label>UPs in Print Area<input id='oUps' readonly></label><label>Print Areas from Parent Sheet<input id='oParentUps' readonly></label><label>Wastage %<input id='oWaste' type='number' value='5'></label><label>Ream / Packet Quantity<input id='oReamQty' type='number' value='500'></label><label>Full Ream / Packet Price (Rs)<input id='oReamPrice' type='number' value='15000'></label><label>Cost Per Parent Sheet<input id='oPaperRate' readonly></label><label>Printing Colors<select id='oColors'><option>1 Color</option><option>2 Color</option><option selected>4 Color</option><option>5 Color</option><option>6 Color</option></select></label><label>Printing Side<select id='oSides'><option>Single Side</option><option>Front & Back</option></select></label><label>Plate Rate / Plate (Rs)<input id='oPlateRate' type='number' value='500'></label><label>Number of Plates (Manual)<input id='oPlateQty' type='number' value='4' min='0'></label><label>Printing Rate / 1000 Impressions (Rs)<input id='oPrintingRate' type='number' value='500'></label><label>Printing Units × 1000 (Manual)<input id='oPrintingQty' type='number' value='1' min='0' step='1'></label><label>Lamination<input id='oLamination' type='number' value='0'></label><label>UV / Spot UV<input id='oUV' type='number' value='0'></label><label>Die Cost<input id='oDie' type='number' value='0'></label><label>Die Cutting<input id='oDieCut' type='number' value='0'></label><label>Pasting / Folding<input id='oPasting' type='number' value='0'></label><label>Transport<input id='oTransport' type='number' value='0'></label><label>Other / Vendor Cost<input id='oOther' type='number' value='0'></label><label>Profit / Markup %<input id='oProfit' type='number' value='20'></label></div><button class='calc' onclick='calcOffset()'>Calculate Offset Quotation</button><div id='oResult' class='result'></div></section><section id='packaging' class='panel'><h2>Offset Packaging Calculator — A to Z</h2><p class='note'>Bottle, perfume, cosmetic, medicine, food, cake, pizza, burger, sleeves, cartons, shopping bags aur custom packaging.</p><div class='grid'><label>Customer Name<input id='pCustomer'></label><label>Packaging Type<div class='withplus'><select id='pType'></select><button type='button' class='plus' onclick="addOption('pType','dlaPackagingItems','New Packaging Type')">+</button></div></label><label>Quantity<input id='pQty' type='number' value='1000'></label><label>Material / Paper<div class='withplus'><select id='pPaper'></select><button type='button' class='plus' onclick="addOption('pPaper','dlaPapers','New Paper Type')">+</button></div></label><label>GSM<input id='pGsm' type='number' value='300'></label><label>Finished Box L × W × H (inch)<input id='pBoxSize' placeholder='e.g. 2x2x6'></label><label>Flat Die-Line / Print Size (inch)<input id='pJobSize' value='8x6'></label><label>Parent Sheet Size (inch)<input id='pSheetSize' value='23x36'></label><label>Machine Print Area (inch)<input id='pPrintArea' value='11.5x18'></label><label>UPs in Print Area<input id='pUps' readonly></label><label>Print Areas from Parent Sheet<input id='pParentUps' readonly></label><label>Wastage %<input id='pWaste' type='number' value='8'></label><label>Ream / Packet Quantity<input id='pReamQty' type='number' value='500'></label><label>Full Ream / Packet Price (Rs)<input id='pReamPrice' type='number' value='15000'></label><label>Cost Per Parent Sheet<input id='pPaperRate' readonly></label><label>Colors<select id='pColors'><option>1 Color</option><option>2 Color</option><option selected>4 Color</option><option>5 Color</option><option>6 Color</option></select></label><label>Printing Side<select id='pSides'><option>Single Side</option><option>Front & Back</option></select></label><label>Plate Rate / Plate (Rs)<input id='pPlateRate' type='number' value='500'></label><label>Number of Plates (Manual)<input id='pPlateQty' type='number' value='4'></label><label>Printing Rate / 1000 Impressions (Rs)<input id='pPrintingRate' type='number' value='500'></label><label>Printing Units × 1000 (Manual)<input id='pPrintingQty' type='number' value='1'></label><label>Lamination<input id='pLam' type='number' value='0'></label><label>UV / Spot UV<input id='pUV' type='number' value='0'></label><label>Foil / Hot Stamp<input id='pFoil' type='number' value='0'></label><label>Emboss / Deboss<input id='pEmboss' type='number' value='0'></label><label>Die Cost<input id='pDie' type='number' value='0'></label><label>Die Cutting / Creasing<input id='pDieCut' type='number' value='0'></label><label>Pasting / Gluing<input id='pPasting' type='number' value='0'></label><label>Window Patch / PVC<input id='pWindow' type='number' value='0'></label><label>Inner Tray / Insert<input id='pInsert' type='number' value='0'></label><label>Handle / Rope / Eyelet<input id='pHandle' type='number' value='0'></label><label>Service / Handling<input id='pService' type='number' value='0'></label><label>Transport<input id='pTransport' type='number' value='0'></label><label>Other / Vendor Cost<input id='pOther' type='number' value='0'></label><label>Profit / Markup %<input id='pProfit' type='number' value='20'></label></div><button class='calc' onclick='calcPackaging()'>Calculate Packaging Quotation</button><div id='pResult' class='result'></div></section><section id='digital' class='panel'><h2>Digital Printing Calculator</h2><div class='grid'><label>Customer Name<input id='dCustomer'></label><label>Print Type<select id='dType'><option>Color Print</option><option>Black Print</option><option>Photo Print</option><option>Card Print</option><option>Sticker Print</option></select></label><label>Paper Size<select id='dSize'><option>A4</option><option>A3</option><option>A3+</option><option>Legal</option><option>4x6</option><option>5x7</option><option>Custom</option></select></label><label>Paper Type<input id='dPaper' value='Normal'></label><label>Quantity<input id='dQty' type='number' value='1'></label><label>Printing Rate / Print<input id='dPrintRate' type='number' value='50'></label><label>Paper Cost / Sheet<input id='dPaperCost' type='number' value='0'></label><label>Printing Side<select id='dSides'><option value='1'>Single Side</option><option value='2'>Double Side</option></select></label><label>Lamination<input id='dLam' type='number' value='0'></label><label>Cutting / Binding<input id='dFinish' type='number' value='0'></label><label>Design Charges<input id='dDesign' type='number' value='0'></label><label>Other Charges<input id='dOther' type='number' value='0'></label><label>Profit / Markup %<input id='dProfit' type='number' value='20'></label></div><button class='calc' onclick='calcDigital()'>Calculate Digital Quotation</button><div id='dResult' class='result'></div></section></main><script src='script.js'></script></body></html>
