<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Design Line Printing Calculator</title><link rel='stylesheet' href='style.css'></head><body><header><h1>Design Line Agency</h1><p>Offset & Digital Printing Quotation Calculator</p></header><main><nav><button class='tab active' data-tab='offset'>Offset Printing</button><button class='tab' data-tab='digital'>Digital Printing</button><button class='tab' data-tab='rates'>Rate Master</button></nav><section id='offset' class='panel active'><h2>Offset Printing Calculator</h2><div class='grid'><label>Customer Name<input id='oCustomer'></label><label>Item Type<select id='oItem'><option>Visiting Card</option><option>Flyer / Pamphlet</option><option>Menu</option><option>Letterhead</option><option>Art Card</option><option>Bleach Card Box</option><option>Cake Box</option><option>Pizza Box</option><option>Burger / Zinger Box</option><option>Shopping Bag</option><option>Custom Item</option></select></label><label>Quantity<input id='oQty' type='number' value='1000'></label><label>Paper Type<select id='oPaper'><option>Art Paper</option><option>Art Card</option><option>Bleach Card</option><option>Sticker</option><option>Other</option></select></label><label>GSM<input id='oGsm' type='number' value='300'></label><label>Sheet Size<input id='oSheetSize' value='23x36'></label><label>Ups per Sheet<input id='oUps' type='number' value='8'></label><label>Wastage %<input id='oWaste' type='number' value='5'></label><label>Paper Rate / Sheet<input id='oPaperRate' type='number' value='30'></label><label>Printing Colors<select id='oColors'><option value='1'>1 Color</option><option value='2'>2 Color</option><option value='4' selected>4 Color</option></select></label><label>Printing Side<select id='oSides'><option value='1'>Single Side</option><option value='2'>Front & Back</option></select></label><label>Plate Cost / Plate<input id='oPlateRate' type='number' value='500'></label><label>Printing Cost<input id='oPrinting' type='number' value='2500'></label><label>Lamination<input id='oLamination' type='number' value='0'></label><label>Die Cost<input id='oDie' type='number' value='0'></label><label>Die Cutting<input id='oDieCut' type='number' value='0'></label><label>Pasting / Folding<input id='oPasting' type='number' value='0'></label><label>Transport<input id='oTransport' type='number' value='0'></label><label>Other / Vendor Cost<input id='oOther' type='number' value='0'></label><label>Profit / Markup %<input id='oProfit' type='number' value='20'></label></div><button class='calc' onclick='calcOffset()'>Calculate Offset Quotation</button><div id='oResult' class='result'></div></section><section id='digital' class='panel'><h2>Digital Printing Calculator</h2><div class='grid'><label>Customer Name<input id='dCustomer'></label><label>Print Type<select id='dType'><option>Color Print</option><option>Black Print</option><option>Photo Print</option><option>Card Print</option><option>Sticker Print</option></select></label><label>Paper Size<select id='dSize'><option>A4</option><option>A3</option><option>A3+</option><option>Legal</option><option>4x6</option><option>5x7</option><option>Custom</option></select></label><label>Paper Type<input id='dPaper' value='Normal'></label><label>Quantity<input id='dQty' type='number' value='1'></label><label>Printing Rate / Print<input id='dPrintRate' type='number' value='50'></label><label>Paper Cost / Sheet<input id='dPaperCost' type='number' value='0'></label><label>Printing Side<select id='dSides'><option value='1'>Single Side</option><option value='2'>Double Side</option></select></label><label>Lamination<input id='dLam' type='number' value='0'></label><label>Cutting / Binding<input id='dFinish' type='number' value='0'></label><label>Design Charges<input id='dDesign' type='number' value='0'></label><label>Other Charges<input id='dOther' type='number' value='0'></label><label>Profit / Markup %<input id='dProfit' type='number' value='20'></label></div><button class='calc' onclick='calcDigital()'>Calculate Digital Quotation</button><div id='dResult' class='result'></div></section><section id='rates' class='panel'><h2>Rate Master</h2><p>Admin rates browser mein save kar sakta hai. Calculator ke default rates yahan se update honge.</p><div class='grid'><label>Offset Paper / Sheet<input id='rPaper' type='number'></label><label>Plate / Plate<input id='rPlate' type='number'></label><label>Digital Print / Print<input id='rDigital' type='number'></label><label>Default Profit %<input id='rProfit' type='number'></label></div><button class='calc' onclick='saveRates()'>Save Rates</button><p id='rateMsg'></p></section></main><script src='script.js'></script></body></html>
